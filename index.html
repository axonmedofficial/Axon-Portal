        // 3. Central Division Registry Desk with 6 monochrome divisions

            const divisions = [

                {

            const filteredDivisions = divisions.filter(

        // 4. Photo Archive Desk supporting local base64 upload and deletion
        function PhotoRegistry() {
            const [records, setRecords] = useState([]);
            const [caption, setCaption] = useState("");
            const [imageFile, setImageFile] = useState(null);
            const [errorMsg, setErrorMsg] = useState(null);
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [filterDivNum, setFilterDivNum] = useState("all");

            useEffect(() => {
                const saved = localStorage.getItem("axon_photo_records");
                if (saved) {
                    setRecords(JSON.parse(saved));
                }
            }, []);

            const saveRecords = (newRecords) => {
                setRecords(newRecords);
                localStorage.setItem("axon_photo_records", JSON.stringify(newRecords));
            };

            const handleFileChange = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;

                if (file.size > 5 * 1024 * 1024) {
                    setErrorMsg("File limit exceeded (5MB max).");
                    return;
                }

                const reader = new FileReader();
                reader.onload = () => {
                    if (typeof reader.result === "string") {
                        setImageFile(reader.result);
                    }
                };
                reader.readAsDataURL(file);
            };

            const handleAdd = (e) => {
                e.preventDefault();
                if (!caption.trim() || !imageFile) {
                    setErrorMsg("Caption and Image are both strictly required.");
                    return;
                }

                const newRecord = {
                    id: "photo-" + Date.now().toString(),
                    caption: caption.trim(),
                    divisionNum: "01",
                    divisionName: "Research Outreach",
                    date: new Date().toLocaleDateString(),
                    imageUrl: imageFile
                };

                const updated = [newRecord, ...records];
                saveRecords(updated);
                setCaption("");
                setImageFile(null);
                setIsFormOpen(false);
            };

            const handleDelete = (id, e) => {
                e.stopPropagation();
                if (confirm("Purge photograph output record? This deletion is irreversible.")) {
                    const filtered = records.filter(x => x.id !== id);
                    saveRecords(filtered);
                }
            };

            return (
                <div className="relative py-16 px-4 border-t border-slate-900 bg-slate-950/10" id="photo-records-section">
                    <div className="max-w-6xl mx-auto z-10 relative">
                        
                        <div className="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
                            <div>
                                <span className="inline-flex items-center gap-2 px-3 py-1 bg-white/[0.04] border border-white/10 rounded-full text-xs font-mono text-slate-400 uppercase tracking-widest font-bold">
                                    📷 DIGITAL PHOTO ARCHIVE
                                </span>
                                <h2 className="font-serif text-3xl font-bold tracking-tight text-white m-0 mt-3">
                                    AXON Field Photographic Archive
                                </h2>
                                <p className="text-sm text-slate-400 mt-2">
                                    Browse diagnostic presentation records or upload coordinates below securely.
                                </p>
                            </div>
                            <button
                                onClick={() => setIsFormOpen(!isFormOpen)}
                                className="px-4 py-2.5 bg-white text-slate-950 hover:bg-slate-100 font-mono text-xs tracking-wider uppercase rounded-xl font-bold cursor-pointer"
                            >
                                {isFormOpen ? "CLOSE" : "UPLOAD COORDINATES"}
                            </button>
                        </div>

                        {isFormOpen && (
                            <form onSubmit={handleAdd} className="bg-[#0b1329] border border-slate-800 rounded-3xl p-6 mb-12 space-y-4 max-w-xl mx-auto">
                                <h3 className="font-serif text-white font-bold text-lg border-b border-slate-800 pb-2">Catalog activity photo</h3>
                                
                                {errorMsg && <p className="text-red-400 text-xs font-mono">{errorMsg}</p>}
                                
                                <div className="space-y-1.5">
                                    <label className="block text-[10px] font-mono text-slate-400 uppercase font-bold">Image file (PNG/JPG)</label>
                                    <input type="file" accept="image/*" onChange={handleFileChange} className="w-full text-xs bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-white focus:outline-none" />
                                    {imageFile && <img src={imageFile} className="max-h-[140px] rounded-lg mt-2 border border-slate-800" />}
                                </div>

                                <div className="space-y-1.5">
                                    <label className="block text-[10px] font-mono text-slate-400 uppercase font-bold">Caption Text</label>
                                    <textarea rows="3" value={caption} onChange={(e) => setCaption(e.target.value)} placeholder="Provide context regarding actual projects..." className="w-full text-xs bg-slate-950 text-white placeholder-slate-500 border border-slate-800 p-3 rounded-xl focus:outline-none" />
                                </div>

                                <div className="flex justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setIsFormOpen(false)} className="px-4 py-2 text-xs font-mono bg-transparent border border-slate-800 rounded-lg text-slate-400">Cancel</button>
                                    <button type="submit" className="px-5 py-2 text-xs font-mono bg-white text-slate-900 font-bold rounded-lg uppercase">Add Record</button>
                                </div>
                            </form>
                        )}

                        {records.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {records.map((rec) => (
                                    <div key={rec.id} className="group bg-[#0b1329]/90 border border-slate-900 rounded-2xl overflow-hidden shadow-md hover:border-white/10 transition-colors flex flex-col justify-between">
                                        <div>
                                            <div className="aspect-[4/3] relative bg-slate-950 border-b border-slate-900">
                                                <img src={rec.imageUrl} className="w-full h-full object-cover" />
                                                <button onClick={(e) => handleDelete(rec.id, e)} className="absolute bottom-3 right-3 p-1.5 bg-black/80 hover:bg-neutral-900 border border-red-500/20 text-red-400 hover:text-red-300 rounded cursor-pointer">
                                                    Purge
                                                </button>
                                            </div>
                                            <div className="p-4 space-y-2">
                                                <span className="text-[9px] font-mono text-slate-505 text-indigo-400 font-bold uppercase">{rec.date}</span>
                                                <p className="text-white text-xs italic leading-relaxed font-sans mt-1">"{rec.caption}"</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center p-12 rounded-2xl border border-dashed border-slate-850">
                                <p className="text-slate-505 text-slate-500 text-xs font-mono">NO IMAGES CATALOGED YET. UPLOAD PHOTOS TO STORE THEM IN LOCAL STORAGE STORAGE PORTALS.</p>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

                            <a

                            >
                                View Signed Constitution PDF <Compass />
                            </a>
                        </div>

                        {/* Tabs list */}
                        <div className="flex justify-center border-b border-slate-800 mb-8 font-mono text-xs flex-wrap gap-2">
                            <button onClick={() => setActiveTab("structure")} className={`pb-3 px-4 ${activeTab === "structure" ? "text-indigo-400 border-b-2 border-indigo-500 font-bold" : "text-slate-400"}`}>Structure</button>
                            <button onClick={() => setActiveTab("pledge")} className={`pb-3 px-4 ${activeTab === "pledge" ? "text-indigo-400 border-b-2 border-indigo-500 font-bold" : "text-slate-400"}`}>Sovereign Pledge Oath</button>

                        {activeTab === "structure" ? (
