<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON | Executive Command & Operations Portal</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-surface: #131b2e;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-glow: rgba(56, 189, 248, 0.2);
            --border-muted: #22314d;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-neon: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar { width: 280px; background-color: #060911; border-right: 1px solid var(--border-muted); position: fixed; height: 100vh; }
        .workspace { margin-left: 280px; flex-grow: 1; padding: 40px; }
        
        .premium-banner { background: linear-gradient(135deg, rgba(19, 27, 46, 0.8) 0%, rgba(9, 13, 22, 0.9) 100%); border: 1px solid var(--border-glow); border-radius: 12px; padding: 30px; margin-bottom: 35px; }
        
        .macro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .macro-card { background: var(--bg-card); border: 1px solid var(--border-muted); border-radius: 10px; padding: 24px; }
        
        .action-btn { display: block; text-align: center; background: #1e293b; color: white; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: 600; border: 1px solid var(--border-muted); margin-top: 15px; }
        .action-btn:hover { background: var(--blue-neon); color: black; }
        
        @media(max-width: 992px) { .sidebar { display: none; } .workspace { margin-left: 0; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="padding: 30px; text-align: center;">
            <h1 style="color: white; letter-spacing: 5px;">AXON</h1>
        </div>
    </div>

    <div class="workspace">
        <div class="premium-banner">
            <h2>AXON Command Engine</h2>
            <p style="color: var(--text-muted);">Internal operational dashboard for executive management and member onboarding.</p>
        </div>

        <div class="macro-grid">
            <div class="macro-card">
                <h3>📜 Governance Charter</h3>
                <p style="color: var(--text-muted);">Access the official AXON structural rules.</p>
                <a href="AXON_Official_Constitution_Charter.pdf" target="_blank" class="action-btn">View Master Constitution</a>
            </div>
            
            <div class="macro-card">
                <h3>📋 Recruitment Intake</h3>
                <p style="color: var(--text-muted);">Link for student applications and member registrations.</p>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLScF8_VZMg2k3OYVpqiz6wansWfe0DObcY8RUxnFvPlJy19nGQ/viewform" target="_blank" class="action-btn">Open Application Form</a>
            </div>
        </div>
    </div>

</body>
</html>
